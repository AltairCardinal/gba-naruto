<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火影忍者 · 木叶战记 ROM 编辑器</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/route.css">
<link rel="stylesheet" href="css/assets.css">
<link rel="stylesheet" href="css/audio.css">
<link rel="stylesheet" href="css/script.css">
<link rel="stylesheet" href="css/character.css">
<link rel="stylesheet" href="css/item.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/dialogue.css">
<link rel="stylesheet" href="css/battle-map.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">木叶</span>
    <div>
      <div class="brand-title">火影忍者 · 木叶战记 ROM 编辑器</div>
      <div class="brand-sub" id="rom-status">正在载入内容包…</div>
    </div>
  </div>
  <div class="load-progress hidden" id="load-progress">
    <div class="load-progress-bar"><div class="load-progress-fill" id="load-progress-fill"></div></div>
    <div class="load-progress-text" id="load-progress-text"></div>
  </div>
  <div class="topbar-tools">
    <button class="btn btn-ghost hidden" id="btn-retry" title="重新载入内容包">重试</button>
    <button class="btn btn-ghost hidden" id="btn-undo"
      title="撤销上一步改动（Ctrl+Z）">撤销</button>
    <button class="btn btn-primary" id="btn-build"
      title="把内容包 + 原版 ROM 构建成新的 ROM">构建 ROM</button>
    <span class="dirty-badge hidden" id="dirty-badge">0</span>
  </div>
</header>

<!-- 载入状态条：ROM 与内容包各一个槽位，各自带「二选一」的载入入口与状态标记。 -->
<div class="loadbar">
  <div class="slot" id="slot-rom"></div>
  <div class="slot" id="slot-pack"></div>
</div>

<div class="layout">
  <nav class="sidenav" id="sidenav"></nav>
  <main class="main" id="main"></main>
</div>

<div class="statusbar" id="statusbar">
  <span id="status-text">就绪</span>
  <span class="spacer"></span>
  <span id="status-hint"></span>
</div>

<!-- 文件选择器藏在底部：载入状态条上的「在本地浏览上传」是 label，指向它们。 -->
<input type="file" id="rom-file" accept=".gba" hidden>
<input type="file" id="pack-file" accept=".json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
